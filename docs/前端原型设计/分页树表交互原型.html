<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>分页树表交互原型</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #20283a;
        --muted: #7d879a;
        --line: #e7ebf3;
        --primary: #6675e9;
        --danger: #d96b75;
        --success: #4aaf89;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Arial, "Microsoft YaHei", sans-serif; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      .shell { max-width: 1440px; margin: 0 auto; padding: 30px 34px 50px; }
      .breadcrumb, .hint, .muted { color: var(--muted); }
      h1, h2, p { margin: 0; }
      h1 { margin-top: 6px; font-size: 26px; }
      h2 { font-size: 17px; }
      .page-head, .toolbar, .table-footer, .parent-cell, .node-main, .load-row { display: flex; align-items: center; }
      .page-head, .toolbar, .table-footer { justify-content: space-between; gap: 16px; }
      .toolbar { margin-top: 24px; justify-content: flex-start; flex-wrap: wrap; }
      input, select, .text-button { border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); padding: 8px 12px; }
      .text-button { color: var(--primary); border-color: transparent; background: transparent; }
      .text-button.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
      .text-button.danger { color: var(--danger); }
      .notice { min-height: 22px; margin-top: 12px; color: var(--success); }
      .table-card { margin-top: 16px; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: 0 6px 18px rgba(50, 65, 110, .04); }
      .tree-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      .tree-table th, .tree-table td { padding: 14px 16px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
      .tree-table th { color: var(--text); background: #fbfcfe; font-weight: 500; }
      .tree-table th:first-child { width: 34%; }
      .tree-table th:last-child { width: 16%; }
      .tree-table td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .parent-row td { background: #fff; font-weight: 600; }
      .child-row td { background: #fcfdff; color: #4b556b; }
      .parent-cell { gap: 8px; }
      .toggle { width: 22px; height: 22px; padding: 0; border: 0; background: transparent; color: var(--primary); font-size: 18px; line-height: 1; transition: transform .15s ease; }
      .toggle.expanded { transform: rotate(90deg); }
      .child-node { display: flex; align-items: center; min-width: 0; }
      .child-tree-guide { position: relative; display: inline-block; flex: 0 0 30px; height: 22px; }
      .child-tree-guide::before { position: absolute; top: -14px; bottom: -14px; left: 8px; border-left: 1px solid #cbd3e1; content: ""; }
      .child-tree-guide.is-last::before { bottom: 50%; }
      .child-tree-guide::after { position: absolute; top: 50%; left: 8px; width: 15px; border-top: 1px solid #cbd3e1; content: ""; }
      .tree-node-dot { position: absolute; top: 50%; left: 5px; width: 7px; height: 7px; border: 2px solid #9da9be; border-radius: 50%; background: #fff; transform: translateY(-50%); }
      .child-row td:first-child { padding-left: 28px; }
      .status { color: var(--success); }
      .load-row td { padding: 10px 16px 14px; background: #fcfdff; }
      .load-row .load-content { width: 100%; padding-left: 58px; }
      .load-row .child-load-content { position: relative; }
      .load-row .child-load-content::before { position: absolute; top: -14px; bottom: -14px; left: 8px; border-left: 1px solid #cbd3e1; content: ""; }
      .load-row .text-button { padding-left: 0; }
      .loading-text { color: var(--muted); }
      .error-text { color: var(--danger); }
      .empty { padding: 70px 20px; color: var(--muted); text-align: center; }
      .table-footer { padding: 14px 16px; color: var(--muted); }
      .table-footer .text-button { padding: 4px 8px; }
      .footer-actions { display: flex; align-items: center; gap: 8px; }
      .state-panel { display: flex; gap: 8px; align-items: center; margin-top: 18px; color: var(--muted); }
      .footer-note { margin-top: 18px; color: var(--muted); font-size: 12px; }
      @media (max-width: 760px) {
        .shell { padding: 20px; }
        .page-head { align-items: flex-start; flex-direction: column; }
        .tree-table { min-width: 900px; }
        .table-card { overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="page-head">
        <div>
          <div class="breadcrumb">平台管理 / 组织管理</div>
          <h1>分页树表交互原型</h1>
          <p class="hint">父节点和子节点分别追加加载，不使用传统页码分页</p>
        </div>
        <button class="text-button" id="refresh">刷新</button>
      </header>

      <div class="toolbar">
        <input id="keyword" placeholder="节点名称" aria-label="节点名称" />
        <select id="status" aria-label="节点状态">
          <option>全部状态</option>
          <option>正常</option>
          <option>已停用</option>
        </select>
        <button class="text-button primary" id="query">查询</button>
        <button class="text-button" id="reset">重置</button>
      </div>
      <div id="notice" class="notice" aria-live="polite"></div>

      <section class="table-card" aria-label="分页树表">
        <table class="tree-table">
          <thead>
            <tr>
              <th>列属性1</th>
              <th>列属性2</th>
              <th>列属性3</th>
              <th>列属性4</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="treeBody"></tbody>
        </table>
        <div id="tableEmpty" class="empty" hidden>暂无数据</div>
        <div id="parentFooter" class="table-footer"></div>
      </section>

      <div class="state-panel">
        <span>演示状态：</span>
        <button class="text-button" data-demo="parent-error">父节点加载失败</button>
        <button class="text-button" data-demo="child-error">子节点加载失败</button>
        <button class="text-button" data-demo="empty">空数据</button>
        <button class="text-button" data-demo="normal">恢复正常</button>
      </div>
      <p class="footer-note">原型示意：同级子节点通过垂直引导线连接，最后一个已加载节点收线；父节点首批加载 6 条，子节点首批加载 5 条。</p>
    </main>

    <script>
      const parentBatchSize = 6;
      const childBatchSize = 5;
      const allParents = Array.from({ length: 10 }, (_, index) => ({
        id: index + 1,
        name: `父节点-${index + 1}`,
        value2: `父属性-${index + 1}`,
        value3: index % 2 === 0 ? "正常" : "已停用",
        value4: `父节点扩展信息-${index + 1}`,
        childTotal: index === 2 ? 0 : index === 0 ? 8 : 2 + index,
      }));
      const parentState = new Map();
      let loadedParentCount = parentBatchSize;
      let demoState = "normal";

      function getParentState(parent) {
        if (!parentState.has(parent.id)) {
          parentState.set(parent.id, {
            expanded: false,
            loadedChildren: 0,
            loading: false,
            error: false,
          });
        }
        return parentState.get(parent.id);
      }

      function visibleParents() {
        if (demoState === "empty") return [];
        const keyword = document.querySelector("#keyword").value.trim();
        if (!keyword) return allParents.slice(0, loadedParentCount);
        return allParents.filter((parent) => parent.name.includes(keyword));
      }

      function render() {
        const body = document.querySelector("#treeBody");
        const empty = document.querySelector("#tableEmpty");
        body.innerHTML = "";
        const parents = visibleParents();
        empty.hidden = parents.length > 0;
        parents.forEach((parent) => renderParent(body, parent));
        renderParentFooter(parents);
      }

      function renderParent(body, parent) {
        const state = getParentState(parent);
        const row = document.createElement("tr");
        row.className = "parent-row";
        row.innerHTML = `<td><div class="parent-cell"><button class="toggle${state.expanded ? " expanded" : ""}" aria-label="${state.expanded ? "收起" : "展开"}${parent.name}">&gt;</button><strong>${parent.name}</strong></div></td><td>${parent.value2}</td><td class="status">${parent.value3}</td><td>${parent.value4}</td><td><button class="text-button">查看</button></td>`;
        row.querySelector(".toggle").addEventListener("click", () => toggleParent(parent));
        body.appendChild(row);
        if (!state.expanded) return;
        if (state.error) {
          renderLoadRow(body, parent, "child-error", "子节点加载失败，请重试");
          return;
        }
        if (state.loading) {
          renderLoadRow(body, parent, "loading", "子节点加载中...");
          return;
        }
        for (let index = 0; index < state.loadedChildren; index += 1) {
          renderChild(body, parent, index, state.loadedChildren === parent.childTotal && index === state.loadedChildren - 1);
        }
        if (state.loadedChildren === 0 && parent.childTotal === 0) {
          renderLoadRow(body, parent, "empty", "暂无子节点");
          return;
        }
        if (state.loadedChildren < parent.childTotal) {
          renderLoadRow(body, parent, "child-more", `已加载 ${state.loadedChildren} 条，还剩 ${parent.childTotal - state.loadedChildren} 条`);
        }
      }

      function renderChild(body, parent, index, isLast) {
        const row = document.createElement("tr");
        row.className = "child-row";
        row.innerHTML = `<td><div class="child-node"><span class="child-tree-guide${isLast ? " is-last" : ""}" aria-hidden="true"><span class="tree-node-dot"></span></span><span>子节点-${parent.id}${index + 1}</span></div></td><td>子属性-${index + 1}</td><td class="status">正常</td><td>子节点扩展信息-${index + 1}</td><td><button class="text-button">查看</button></td>`;
        body.appendChild(row);
      }

      function renderLoadRow(body, parent, type, message) {
        const row = document.createElement("tr");
        row.className = "load-row";
        const button = type === "child-more" ? `<button class="text-button" data-parent-more="${parent.id}">加载更多</button>` : type === "child-error" ? `<button class="text-button" data-parent-retry="${parent.id}">重新加载</button>` : "";
        const loadClass = type === "child-more" ? " child-load-content" : "";
        row.innerHTML = `<td colspan="5"><div class="load-content${loadClass}"><span class="${type === "child-error" ? "error-text" : type === "loading" ? "loading-text" : "muted"}">${message}</span>${button}</div></td>`;
        row.querySelector("[data-parent-more]")?.addEventListener("click", () => loadChildren(parent));
        row.querySelector("[data-parent-retry]")?.addEventListener("click", () => loadChildren(parent));
        body.appendChild(row);
      }

      function renderParentFooter(parents) {
        const footer = document.querySelector("#parentFooter");
        if (demoState === "parent-error") {
          footer.innerHTML = `<span class="error-text">父节点加载失败，请重试</span><button class="text-button" id="parentRetry">重新加载</button>`;
          document.querySelector("#parentRetry").addEventListener("click", () => { demoState = "normal"; render(); });
          return;
        }
        if (parents.length === 0) {
          footer.innerHTML = "";
          return;
        }
        if (loadedParentCount < allParents.length && !document.querySelector("#keyword").value.trim()) {
          footer.innerHTML = `<span>已加载 ${loadedParentCount} 个父节点，还剩 ${allParents.length - loadedParentCount} 个</span><button class="text-button" id="parentMore">加载更多</button>`;
          document.querySelector("#parentMore").addEventListener("click", loadParents);
          return;
        }
        if (!document.querySelector("#keyword").value.trim()) {
          footer.innerHTML = `<span>已加载全部 ${loadedParentCount} 个父节点</span>`;
        }
      }

      function toggleParent(parent) {
        const state = getParentState(parent);
        state.expanded = !state.expanded;
        if (state.expanded && state.loadedChildren === 0 && parent.childTotal > 0) loadChildren(parent);
        else render();
      }

      function loadChildren(parent) {
        const state = getParentState(parent);
        state.expanded = true;
        state.error = false;
        state.loading = true;
        render();
        window.setTimeout(() => {
          if (demoState === "child-error") {
            state.loading = false;
            state.error = true;
            render();
            return;
          }
          state.loadedChildren = Math.min(state.loadedChildren + childBatchSize, parent.childTotal);
          state.loading = false;
          render();
        }, 550);
      }

      function loadParents() {
        const button = document.querySelector("#parentMore");
        if (button) { button.disabled = true; button.textContent = "加载中"; }
        window.setTimeout(() => {
          loadedParentCount = Math.min(loadedParentCount + parentBatchSize, allParents.length);
          render();
        }, 550);
      }

      function resetTree() {
        loadedParentCount = parentBatchSize;
        parentState.clear();
        demoState = "normal";
        render();
      }

      document.querySelector("#query").addEventListener("click", () => { parentState.clear(); render(); });
      document.querySelector("#reset").addEventListener("click", () => {
        document.querySelector("#keyword").value = "";
        document.querySelector("#status").selectedIndex = 0;
        resetTree();
      });
      document.querySelector("#refresh").addEventListener("click", resetTree);
      document.querySelectorAll("[data-demo]").forEach((button) => {
        button.addEventListener("click", () => {
          resetTree();
          demoState = button.dataset.demo;
          render();
        });
      });
      render();
    </script>
  </body>
</html>
