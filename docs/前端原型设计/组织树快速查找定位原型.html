<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>组织树快速查找定位原型</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #20283a;
        --muted: #7d879a;
        --line: #e7ebf3;
        --primary: #6675e9;
        --primary-soft: #eef0ff;
        --danger: #d96b75;
        --success: #4aaf89;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Arial, "Microsoft YaHei", sans-serif; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      h1, h2, p { margin: 0; }
      .shell { max-width: 1440px; margin: 0 auto; padding: 30px 34px 50px; }
      .breadcrumb, .hint, .muted { color: var(--muted); }
      h1 { margin-top: 6px; font-size: 26px; }
      h2 { font-size: 17px; }
      .page-head, .toolbar, .table-footer, .node-main, .modal-head, .modal-foot { display: flex; align-items: center; }
      .page-head, .table-footer, .modal-head, .modal-foot { justify-content: space-between; gap: 16px; }
      .toolbar { gap: 10px; flex-wrap: wrap; }
      .toolbar { margin-top: 24px; }
      .field-label { color: #4b556b; font-size: 13px; }
      input, select, .text-button { border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); padding: 8px 12px; }
      input { min-width: 230px; }
      .text-button { color: var(--primary); border-color: transparent; background: transparent; }
      .text-button.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
      .notice { min-height: 24px; margin-top: 12px; color: var(--success); }
      .notice.error { color: var(--danger); }
      .table-card { margin-top: 16px; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: 0 6px 18px rgba(50, 65, 110, .04); }
      .path-card { margin-top: 16px; padding: 16px 20px; border: 1px solid var(--line); border-radius: 12px; background: #f8fbff; }
      .path-preview { margin-top: 12px; color: var(--text); line-height: 1.9; white-space: pre-line; }
      .path-preview .path-gap { color: var(--primary); cursor: pointer; }
      .path-preview .path-level { margin-left: 28px; }
      .path-preview .path-page { margin-left: 56px; color: var(--muted); }
      .path-preview .path-child { margin-left: 84px; }
      .path-preview .level-9 { margin-left: 84px; }
      .path-preview .level-10 { margin-left: 112px; }
      .tree-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      .tree-table th, .tree-table td { padding: 14px 16px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
      .tree-table th { color: var(--text); background: #fbfcfe; font-weight: 500; }
      .tree-table th:first-child { width: 32%; }
      .tree-table th:last-child { width: 15%; }
      .tree-table td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .parent-row td { background: #fff; font-weight: 600; }
      .child-row td { background: #fcfdff; color: #4b556b; }
      .target-row td { background: var(--primary-soft); }
      .node-main { gap: 8px; }
      .toggle { width: 22px; height: 22px; padding: 0; border: 0; background: transparent; color: var(--primary); font-size: 18px; line-height: 1; }
      .toggle.expanded { transform: rotate(90deg); }
      .child-indent { display: inline-block; width: 30px; color: #b6bfd0; text-align: center; }
      .child-row td:first-child { padding-left: 28px; }
      .locate-row td { background: #eef0ff; color: var(--primary); font-weight: 600; }
      .locate-row td:first-child { padding-left: 58px; }
      .gap-row td { padding: 10px 16px; background: #fcfdff; color: var(--muted); text-align: center; }
      .gap-row .text-button { padding: 0 6px; }
      .locate-mark { display: inline-block; width: 4px; height: 18px; margin-right: 8px; border-radius: 4px; background: var(--primary); vertical-align: middle; }
      .status { color: var(--success); }
      .table-footer { padding: 14px 16px; color: var(--muted); }
      .empty { padding: 70px 20px; color: var(--muted); text-align: center; }
      .demo-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 18px; color: var(--muted); }
      .modal-backdrop { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(32, 40, 58, .36); }
      .modal-backdrop[hidden] { display: none; }
      .modal { width: min(900px, 100%); max-height: min(700px, 90vh); overflow: hidden; border-radius: 14px; background: var(--card); box-shadow: 0 18px 50px rgba(32, 40, 58, .18); }
      .modal-head { padding: 20px 24px 14px; border-bottom: 1px solid var(--line); }
      .modal-body { max-height: 440px; overflow: auto; padding: 0 24px; }
      .result-row { display: grid; grid-template-columns: 1.1fr 1fr 1.4fr .7fr .7fr; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
      .result-row strong, .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .result-row .path { color: var(--muted); }
      .modal-foot { padding: 14px 24px 20px; }
      @media (max-width: 820px) {
        .shell { padding: 20px; }
        .page-head { align-items: flex-start; flex-direction: column; }
        .tree-table { min-width: 900px; }
        .table-card { overflow-x: auto; }
        .modal-body { padding: 0 14px; }
        .result-row { grid-template-columns: 1fr; gap: 4px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="page-head">
        <div>
          <div class="breadcrumb">平台管理 / 组织管理</div>
          <h1>组织树快速查找定位原型</h1>
          <p class="hint">搜索当前权限范围内的组织，自动展开路径并定位到目标节点</p>
        </div>
        <button class="text-button" id="refresh">刷新</button>
      </header>

      <div class="toolbar">
        <label class="field-label" for="keyword">组织名称</label>
        <input id="keyword" placeholder="输入组织名称" aria-label="组织名称" />
        <select aria-label="组织状态">
          <option>全部状态</option>
          <option>正常</option>
          <option>已停用</option>
        </select>
        <button class="text-button primary" id="locate">查询</button>
        <button class="text-button">重置</button>
      </div>
      <div id="notice" class="notice" aria-live="polite"></div>

      <section class="path-card" aria-label="深层祖先路径渐进展开">
        <strong>深层定位上下文</strong>
        <div id="ancestorPath" class="path-preview"></div>
      </section>

      <section class="table-card" aria-label="组织树表">
        <table class="tree-table">
          <thead><tr><th>组织名称</th><th>组织编码</th><th>上级组织</th><th>组织状态</th><th>操作</th></tr></thead>
          <tbody id="treeBody"></tbody>
        </table>
        <div id="tableEmpty" class="empty" hidden>暂无数据</div>
        <div class="table-footer"><span>已加载 6 个根组织</span><button class="text-button">加载更多-父级：根组织</button></div>
      </section>

      <div class="demo-bar">
        <span>演示状态：</span>
        <button class="text-button" data-demo="single">单条匹配：平台组</button>
        <button class="text-button" data-demo="multiple">多条匹配：技术中心</button>
        <button class="text-button" data-demo="deep">非首批定位：节点A</button>
        <button class="text-button" data-demo="empty">无匹配</button>
        <button class="text-button" data-demo="error">模拟接口异常</button>
        <button class="text-button" data-demo="partial">已有第1～6层展开</button>
        <button class="text-button" data-demo="normal">恢复正常</button>
      </div>
    </main>

    <div class="modal-backdrop" id="resultModal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal-head"><div><h2 id="modalTitle">选择要定位的组织</h2><p class="muted">找到多个匹配结果，请根据组织路径和编码选择</p></div><button class="text-button" id="closeModal">关闭</button></header>
        <div class="modal-body" id="resultList"></div>
        <footer class="modal-foot"><span class="muted">共 3 条匹配结果</span><button class="text-button" id="cancelModal">取消</button></footer>
      </section>
    </div>

    <script>
      const roots = [
        { id: "root-1", name: "示例租户服务总部", code: "headquarters", parent: "—", children: [
          { id: "org-1", name: "技术中心", code: "technology", parent: "示例租户服务总部", children: [
            { id: "org-1-1", name: "平台组", code: "platform", parent: "技术中心", children: [] },
          ] },
          { id: "org-2", name: "财务部", code: "finance", parent: "示例租户服务总部", children: [] },
        ] },
        { id: "root-2", name: "南方云启科技总部", code: "nanyun-hq", parent: "—", children: [
          { id: "org-3", name: "技术中心", code: "nanyun-technology", parent: "南方云启科技总部", children: [] },
        ] },
        { id: "root-3", name: "北辰信息技术总部", code: "beichen-hq", parent: "—", children: [
          { id: "org-4", name: "技术中心", code: "beichen-technology", parent: "北辰信息技术总部", children: [] },
        ] },
        { id: "root-4", name: "节点A父", code: "node-a-parent", parent: "—", children: [
          { id: "a-brother-1", name: "节点A兄1", code: "node-a-brother-1", parent: "节点A父", children: [] },
          { id: "a-brother-2", name: "节点A兄2", code: "node-a-brother-2", parent: "节点A父", children: [] },
          { id: "a-brother-3", name: "节点A兄3", code: "node-a-brother-3", parent: "节点A父", children: [] },
          { id: "a-brother-4", name: "节点A兄4", code: "node-a-brother-4", parent: "节点A父", children: [] },
          { id: "a-brother-5", name: "节点A兄5", code: "node-a-brother-5", parent: "节点A父", children: [] },
          { id: "a-brother-6", name: "节点A兄6", code: "node-a-brother-6", parent: "节点A父", children: [] },
          { id: "a-brother-7", name: "节点A兄7", code: "node-a-brother-7", parent: "节点A父", children: [] },
          { id: "node-a", name: "节点A", code: "node-a", parent: "节点A父", children: [] },
          { id: "a-brother-9", name: "节点A兄9", code: "node-a-brother-9", parent: "节点A父", children: [] },
        ] },
      ];
      let highlighted = "";
      let expanded = new Set(["root-1", "org-1"]);
      let locationContext = null;
      let omittedAncestorLayers = 8;
      let existingExpandedDepth = 0;
      const matches = [
        { id: "org-1", name: "技术中心", code: "technology", tenant: "组织树分页性能测试租户", path: "示例租户服务总部 / 技术中心", status: "正常" },
        { id: "org-3", name: "技术中心", code: "nanyun-technology", tenant: "组织树分页性能测试租户", path: "南方云启科技总部 / 技术中心", status: "正常" },
        { id: "org-4", name: "技术中心", code: "beichen-technology", tenant: "组织树分页性能测试租户", path: "北辰信息技术总部 / 技术中心", status: "正常" },
      ];

      function render() {
        const body = document.querySelector("#treeBody");
        body.innerHTML = "";
        roots.forEach((root) => renderNode(body, root, 0));
      }

      function renderNode(body, node, level) {
        const row = document.createElement("tr");
        row.className = `${level === 0 ? "parent-row" : "child-row"}${highlighted === node.id ? " target-row" : ""}`;
        row.id = `row-${node.id}`;
        const hasChildren = node.children.length > 0;
        row.innerHTML = `<td><div class="node-main" style="padding-left:${level * 28}px">${highlighted === node.id ? '<span class="locate-mark" aria-label="当前定位节点"></span>' : ""}${hasChildren ? `<button class="toggle${expanded.has(node.id) ? " expanded" : ""}" aria-label="${expanded.has(node.id) ? "收起" : "展开"}${node.name}">&gt;</button>` : '<span style="width:22px"></span>'}<strong>${node.name}</strong></div></td><td>${node.code}</td><td>${node.parent}</td><td class="status">正常</td><td><button class="text-button">查看</button></td>`;
        body.appendChild(row);
        row.querySelector(".toggle")?.addEventListener("click", () => { expanded.has(node.id) ? expanded.delete(node.id) : expanded.add(node.id); render(); });
        if (expanded.has(node.id)) {
          if (locationContext && locationContext.parentId === node.id) {
            node.children.slice(0, 5).forEach((child) => renderNode(body, child, level + 1));
            if (locationContext.beforeLoaded) {
              node.children.slice(5, 7).forEach((child) => renderNode(body, child, level + 1));
            } else {
              renderGapRow(body, "加载更多-父级：技术中心", () => {
                locationContext.beforeLoaded = true;
                render();
              });
            }
            renderLocatedNode(body, node.children[7], level + 1);
            if (locationContext.afterLoaded) {
              node.children.slice(8).forEach((child) => renderNode(body, child, level + 1));
            } else {
              renderGapRow(body, "加载更多-父级：技术中心", () => {
                locationContext.afterLoaded = true;
                render();
              });
            }
            return;
          }
          node.children.forEach((child) => renderNode(body, child, level + 1));
        }
      }

      function renderLocatedNode(body, node, level) {
        const row = document.createElement("tr");
        row.className = "locate-row target-row";
        row.id = `row-${node.id}`;
        row.innerHTML = `<td><span class="locate-mark" aria-label="当前定位节点"></span>${node.name}</td><td>${node.code}</td><td>${node.parent}</td><td class="status">正常</td><td><button class="text-button">查看</button></td>`;
        body.appendChild(row);
      }

      function renderGapRow(body, text, onClick) {
        const row = document.createElement("tr");
        row.className = "gap-row";
        row.innerHTML = `<td colspan="5"><span>…</span><button class="text-button">${text}</button><span>…</span></td>`;
        row.querySelector("button").addEventListener("click", onClick);
        body.appendChild(row);
      }

      function showNotice(text, error = false) {
        const notice = document.querySelector("#notice");
        notice.textContent = text;
        notice.className = `notice${error ? " error" : ""}`;
      }

      function renderAncestorPath() {
        const path = document.querySelector("#ancestorPath");
        const lines = ['<div class="path-level" style="margin-left:0">性能测试树-000000-第0级</div>'];
        for (let level = 1; level <= existingExpandedDepth; level += 1) {
          lines.push(`<div class="path-level">${"&nbsp;".repeat(level * 4)}性能测试树-000000-第${level}级链路</div>`);
        }
        const firstRevealedLevel = omittedAncestorLayers > 0
          ? existingExpandedDepth + omittedAncestorLayers + 1
          : existingExpandedDepth + 1;
        if (omittedAncestorLayers > 0) {
          lines.push(`<button class="path-gap ancestor-gap text-button" style="margin-left:28px" type="button">… 已省略 ${omittedAncestorLayers} 层，点击查看完整路径 …</button>`);
        }
        function renderLevel(level, indent) {
          const prefix = "&nbsp;".repeat(indent * 4);
          lines.push(`<div class="path-level">${prefix}性能测试树-000000-第${level}级链路</div>`);
          if (level < 9) {
            lines.push(`<div class="path-page">${"&nbsp;".repeat((indent + 1) * 4)}第${level}级第一页</div>`);
            renderLevel(level + 1, indent + 2);
            for (let index = 2; index <= 5; index += 1) {
              lines.push(`<div class="path-child">${"&nbsp;".repeat((indent + 2) * 4)}第${level + 1}级同级节点-${index}</div>`);
            }
            lines.push(`<button class="path-gap load-gap text-button" style="margin-left:${(indent + 1) * 32}px" type="button">加载更多-父级：性能测试树-000000-第${level}级链路</button>`);
            return;
          }
          lines.push(`<div class="path-child target-row">${"&nbsp;".repeat((indent + 1) * 4)}性能测试树-000000-第10级链路</div>`);
          for (let index = 2; index <= 5; index += 1) {
            lines.push(`<div class="path-child">${"&nbsp;".repeat((indent + 1) * 4)}第10级同级节点-${index}</div>`);
          }
          lines.push(`<button class="path-gap load-gap text-button" style="margin-left:${(indent + 1) * 32}px" type="button">加载更多-父级：性能测试树-000000-第9级链路</button>`);
        }
        renderLevel(firstRevealedLevel, existingExpandedDepth + 1);
        path.innerHTML = lines.join("");
        path.querySelectorAll(".ancestor-gap").forEach((button) => button.addEventListener("click", () => {
          if (omittedAncestorLayers > 0) omittedAncestorLayers -= 1;
          renderAncestorPath();
        }));
      }

      function locateResult(result) {
        showNotice(`正在展开组织路径：${result.path}`);
        window.setTimeout(() => {
          expanded.add(result.parentId || (result.id === "org-1" ? "root-1" : result.id === "org-3" ? "root-2" : "root-3"));
          locationContext = result.locationContext || null;
          highlighted = result.id;
          render();
          document.querySelector(`#row-${result.id}`)?.scrollIntoView({ behavior: "smooth", block: "center" });
          showNotice(`已定位到：${result.name}`);
        }, 650);
      }

      function openModal() {
        const list = document.querySelector("#resultList");
        list.innerHTML = matches.map((item) => `<div class="result-row"><strong>${item.name}</strong><span>${item.code}</span><span class="path">${item.path}</span><span>${item.tenant}</span><span class="status">${item.status}</span><button class="text-button" data-locate="${item.id}">定位</button></div>`).join("");
        list.querySelectorAll("[data-locate]").forEach((button) => button.addEventListener("click", () => {
          const result = matches.find((item) => item.id === button.dataset.locate);
          document.querySelector("#resultModal").hidden = true;
          if (result) locateResult(result);
        }));
        document.querySelector("#resultModal").hidden = false;
      }

      function search() {
        const keyword = document.querySelector("#keyword").value.trim();
        if (!keyword) { showNotice("请输入组织名称或编码。", true); return; }
        const button = document.querySelector("#locate");
        button.disabled = true;
        button.textContent = "查找中";
        window.setTimeout(() => {
          button.disabled = false;
          button.textContent = "查找";
          if (keyword === "平台组" || keyword === "platform") { locateResult({ id: "org-1-1", name: "平台组", path: "示例租户服务总部 / 技术中心 / 平台组" }); return; }
          if (keyword === "节点A" || keyword === "node-a") {
            locateResult({
              id: "node-a",
              name: "节点A",
              parentId: "root-4",
              path: "节点A父 / 节点A",
              locationContext: { parentId: "root-4", beforeLoaded: false, afterLoaded: false },
            });
            return;
          }
          if (keyword === "技术中心" || keyword === "technology") { openModal(); return; }
          if (keyword === "异常") { showNotice("深度查询失败，请重试。", true); return; }
          showNotice("未找到匹配的组织，请检查组织名称或编码。", true);
        }, 450);
      }

      document.querySelector("#locate").addEventListener("click", search);
      document.querySelector("#keyword").addEventListener("keydown", (event) => { if (event.key === "Enter") search(); });
      ["#closeModal", "#cancelModal"].forEach((selector) => document.querySelector(selector).addEventListener("click", () => { document.querySelector("#resultModal").hidden = true; }));
      document.querySelector("#refresh").addEventListener("click", () => { highlighted = ""; locationContext = null; showNotice("组织树已刷新"); render(); });
      document.querySelectorAll("[data-demo]").forEach((button) => button.addEventListener("click", () => {
        const mode = button.dataset.demo;
        const input = document.querySelector("#keyword");
        if (mode === "single") input.value = "平台组";
        if (mode === "multiple") input.value = "技术中心";
        if (mode === "deep") input.value = "节点A";
        if (mode === "empty") input.value = "未登记组织";
        if (mode === "error") input.value = "异常";
        if (mode === "partial") {
          existingExpandedDepth = 6;
          omittedAncestorLayers = 2;
          showNotice("已保留第1～6层展开状态，目标上下文从第6层继续补齐");
          renderAncestorPath();
        }
        if (mode === "normal") { input.value = ""; highlighted = ""; locationContext = null; existingExpandedDepth = 0; omittedAncestorLayers = 8; showNotice("已恢复正常查找状态"); render(); renderAncestorPath(); }
        if (mode !== "normal" && mode !== "partial") search();
      }));
      render();
      renderAncestorPath();
    </script>
  </body>
</html>
