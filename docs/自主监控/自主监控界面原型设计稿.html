<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自主监控 · 交互原型</title>
  <style>
    :root {
      --navy: #101a2d;
      --navy-2: #16243d;
      --blue: #3478f6;
      --text: #19253a;
      --muted: #71809a;
      --line: #e5eaf2;
      --bg: #f5f7fb;
      --white: #ffffff;
      --green: #20a36a;
      --yellow: #d89614;
      --orange: #e87822;
      --red: #dc4b58;
      --purple: #7967d9;
      --app-font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); font: 13px/1.5 var(--app-font-family); background: var(--bg); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 232px; flex: 0 0 232px; color: #c7d1e5; background: var(--navy); }
    .brand { height: 64px; display: flex; align-items: center; padding: 0 22px; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 1px; border-bottom: 1px solid #263451; }
    .brand small { margin-left: 8px; color: #7f91b1; font-size: 10px; font-weight: 400; }
    .nav { padding: 18px 12px; }
    .nav-title { padding: 10px 14px 6px; color: #6f819f; font-size: 11px; }
    .nav-item, .sub-item { width: 100%; border: 0; color: inherit; background: transparent; text-align: left; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 7px; font-size: 14px; }
    .nav-item.active { color: #fff; background: #263b62; }
    .nav-item span:first-child { width: 18px; color: #8ca4cb; text-align: center; }
    .subnav { display: grid; gap: 2px; margin: 4px 0 12px 30px; }
    .sub-item { padding: 8px 12px; color: #9eacc4; border-left: 2px solid transparent; text-align: left; }
    .sub-item:hover, .sub-item.active { color: #fff; border-left-color: #6e9dff; background: #1c2e4d; }
    .main { min-width: 0; flex: 1; }
    .topbar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--line); }
    .crumb { color: var(--muted); }
    .crumb strong { color: var(--text); }
    .user { display: flex; align-items: center; gap: 10px; color: #52617a; }
    .avatar { display: grid; width: 30px; height: 30px; place-items: center; color: #fff; border-radius: 50%; background: var(--blue); }
    .content { padding: 24px 28px 40px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h1 { margin: 0 0 5px; font-size: 22px; }
    h2 { margin: 0; font-size: 16px; }
    .subtext, .caption { color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .control, .text-input { height: 34px; padding: 0 10px; color: var(--text); border: 1px solid #d8dfeb; border-radius: 5px; background: #fff; }
    .btn { height: 34px; padding: 0 13px; border: 1px solid #d5ddea; border-radius: 5px; color: #52617a; background: #fff; }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn.primary { color: #fff; border-color: var(--blue); background: var(--blue); }
    .btn.text { height: auto; padding: 0; border: 0; color: var(--blue); background: transparent; }
    .notice { display: flex; align-items: center; gap: 12px; padding: 13px 16px; margin-bottom: 18px; color: #fff; border: 1px solid #7b3f52; border-radius: 8px; background: linear-gradient(100deg, #4f233e, #2b284c); }
    .notice .level { padding: 3px 7px; color: #fff; border-radius: 4px; background: var(--red); font-size: 11px; }
    .notice strong { flex: 1; }
    .panel { padding: 18px; margin-bottom: 18px; border: 1px solid var(--line); border-radius: 9px; background: #fff; box-shadow: 0 2px 8px rgba(26, 44, 77, .03); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .panel-head .caption { font-size: 12px; }
    .overview-page h1 { font-size: 24px; }
    .overview-page h2 { font-size: 17px; }
    .overview-page .page-head .subtext, .overview-page .panel-head .caption { font-size: 13px; line-height: 1.6; }
    .overview-page .chart-legend, .overview-page .chart-note { font-size: 12px; }
    .overview-page .panel { padding: 24px 26px; margin-bottom: 22px; border-radius: 12px; box-shadow: 0 6px 20px rgba(31, 55, 94, .055); }
    .overview-page .panel-head { margin-bottom: 20px; }
    .overview-page .notice { min-height: 68px; padding: 15px 18px; margin-bottom: 22px; }
    .overview-page .runtime-graph { height: 280px; }
    .overview-page .business-summary { gap: 14px; }
    .overview-page .business-summary-item { min-height: 92px; padding: 18px; }
    .overview-page .chart-grid { gap: 20px; }
    .overview-page .echart.compact { height: 280px; }
    .overview-page .capacity-grid { gap: 14px; padding: 6px 0; }
    .overview-page .capacity-card { min-height: 124px; padding: 18px; }
    .overview-page .incident-row { min-height: 56px; }
    .health-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
    .health-item { padding: 13px; border: 1px solid #e7ecf4; border-radius: 7px; background: #fbfcfe; }
    .health-item .label { display: block; margin-bottom: 8px; color: var(--muted); }
    .health-item strong { display: block; font-size: 15px; }
    .dot { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background: var(--green); }
    .dot.warn { background: var(--yellow); }
    .dot.bad { background: var(--red); }
    .health-matrix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .health-cell { padding: 14px; border: 1px solid #e4eaf3; border-radius: 8px; background: #fbfcfe; }
    .health-cell-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .health-cell-title { font-weight: 700; }
    .health-cell-meta { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .health-cell svg { display: block; width: 100%; height: 32px; margin: 5px 0 8px; }
    .health-cell-impact { color: #65748a; font-size: 11px; }
    .health-visual { display: flex; height: 72px; align-items: center; justify-content: center; margin: 3px 0 8px; }
    .topology-visual { gap: 5px; }
    .topology-node { display: grid; width: 58px; height: 38px; place-items: center; color: #fff; border-radius: 5px; font-size: 10px; }
    .topology-node.ok { background: #20a36a; } .topology-node.warn { background: #d89614; } .topology-node.bad { background: #dc4b58; }
    .topology-link { width: 16px; height: 2px; background: #9ba9bd; }
    .mini-stack { display: grid; width: 88%; gap: 6px; }
    .mini-stack-row { display: flex; height: 15px; overflow: hidden; border-radius: 3px; background: #edf1f6; }
    .mini-stack-row i { display: block; height: 100%; }
    .mini-stack-row .done { background: #5fba8c; } .mini-stack-row .run { background: #5695f4; } .mini-stack-row .wait { background: #e8ae45; } .mini-stack-row .fail { background: #df6370; }
    .combo-visual { position: relative; width: 92%; height: 68px; border-bottom: 1px solid #dce3ed; background: repeating-linear-gradient(to bottom, transparent 0, transparent 21px, #edf1f6 22px); }
    .combo-visual svg { width: 100%; height: 100%; }
    .stage-flow { width: 94%; gap: 3px; }
    .stage-step { position: relative; display: flex; width: 42px; height: 42px; align-items: center; justify-content: center; color: #fff; border-radius: 50%; background: #20a36a; font-size: 9px; text-align: center; }
    .stage-step.current { background: #3478f6; box-shadow: 0 0 0 4px #dce8ff; }
    .stage-step.pending { color: #6b7890; background: #e8edf4; }
    .stage-arrow { width: 12px; height: 2px; background: #b9c5d5; }
    .gauge-visual { width: 92%; gap: 9px; }
    .gauge { position: relative; width: 48px; height: 48px; border: 7px solid #e9edf3; border-radius: 50%; }
    .gauge::after { position: absolute; inset: -7px; border: 7px solid transparent; border-top-color: var(--gauge-color); border-right-color: var(--gauge-color); border-radius: 50%; content: ""; transform: rotate(28deg); }
    .gauge-label { position: absolute; inset: 0; display: grid; place-items: center; color: #53627a; font-size: 10px; font-weight: 700; }
    .fresh-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 92%; }
    .fresh-cell { height: 28px; padding-top: 5px; color: #fff; border-radius: 3px; font-size: 9px; text-align: center; }
    .fresh-cell.fresh { background: #20a36a; } .fresh-cell.late { background: #d89614; } .fresh-cell.error { background: #dc4b58; } .fresh-cell.off { color: #6d7b91; background: #e8edf4; }
    .metric-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .metric { min-height: 84px; padding: 14px 16px; border: 1px solid #e7ecf4; border-radius: 7px; background: #fff; }
    .metric .label { color: var(--muted); }
    .metric .value { margin: 5px 0 2px; font-size: 23px; font-weight: 700; }
    .metric .meta { color: var(--muted); font-size: 11px; }
    .chart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    .chart { position: relative; height: 194px; overflow: hidden; border: 1px solid #eef1f6; border-radius: 7px; background: linear-gradient(#fff, #fbfcff); }
    .chart::before { position: absolute; inset: 20px 12px 28px; background: repeating-linear-gradient(to bottom, transparent 0, transparent 39px, #edf1f7 40px); content: ""; }
    .chart svg { position: absolute; inset: 25px 10px 25px; width: calc(100% - 20px); height: calc(100% - 50px); }
    .chart .x-axis { position: absolute; right: 14px; bottom: 7px; left: 14px; display: flex; justify-content: space-between; color: #9aa6b9; font-size: 10px; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; color: #6d7b91; font-size: 11px; }
    .legend-item::before { display: inline-block; width: 18px; height: 3px; margin: 0 5px 3px 0; border-radius: 2px; background: var(--legend); content: ""; }
    .chart-note { margin-top: 8px; color: var(--muted); font-size: 11px; }
    .echart { width: 100%; height: 286px; }
    .echart.compact { height: 238px; }
    .health-summary { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .health-summary-item { padding: 11px 12px; border: 1px solid #e4eaf3; border-radius: 7px; background: #fbfcfe; }
    .health-summary-item strong { display: block; margin-bottom: 4px; font-size: 13px; }
    .health-summary-item span { color: var(--muted); font-size: 11px; }
    .business-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .business-summary-item { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 15px; border-left: 3px solid #8da3c2; border-radius: 6px; background: #f8faff; }
    .business-summary-item.warn { border-left-color: var(--yellow); }
    .business-summary-item strong { display: block; margin-bottom: 3px; }
    .business-summary-item span { color: var(--muted); font-size: 11px; }
    .business-summary-value { color: var(--text) !important; font-size: 15px !important; font-weight: 700; white-space: nowrap; }
    .capacity-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 8px 0 2px; }
    .capacity-card { padding: 14px; border: 1px solid #e5ebf3; border-radius: 10px; background: #fbfcfe; box-shadow: inset 3px 0 0 #72c99b; }
    .capacity-card-head, .capacity-card-main, .capacity-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .capacity-card-head strong { color: #2e405d; font-size: 13px; }
    .capacity-state { padding: 2px 7px; color: #208357; border-radius: 9px; background: #e7f6ee; font-size: 10px; font-weight: 600; }
    .capacity-card-main { margin-top: 11px; align-items: baseline; justify-content: flex-start; }
    .capacity-rate { color: #203b66; font-size: 22px; line-height: 1; }
    .capacity-amount { overflow: hidden; color: #71809a; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .capacity-track { position: relative; height: 8px; margin-top: 12px; overflow: visible; border-radius: 5px; background: #e9eef5; }
    .capacity-track-fill { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, #62ba8d, #83cea7); }
    .capacity-track-fill.visible { min-width: 8px; }
    .capacity-threshold { position: absolute; top: -3px; bottom: -3px; left: 80%; width: 1px; border-left: 1px dashed #dd6673; }
    .capacity-card-foot { margin-top: 9px; color: #7b879a; font-size: 10px; }
    .capacity-card-foot span:last-child { color: #9a6570; }
    .tip { position: relative; display: inline-flex; width: 15px; height: 15px; align-items: center; justify-content: center; margin-left: 5px; color: #71809a; border: 1px solid #b8c4d6; border-radius: 50%; font-size: 10px; font-weight: 700; cursor: help; }
    .tip::after { position: absolute; z-index: 5; bottom: 23px; left: 50%; display: none; width: 220px; padding: 8px 10px; color: #fff; border-radius: 5px; background: #25334b; content: attr(data-tip); font-size: 11px; font-weight: 400; line-height: 1.5; transform: translateX(-50%); }
    .tip:hover::after { display: block; }
    .runtime-graph { width: 100%; height: 230px; }
    .collection-top { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); gap: 14px; }
    .collection-chart { width: 100%; height: 220px; }
    .collection-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; align-content: center; }
    .collection-kpi { padding: 14px; border: 1px solid #e5eaf2; border-radius: 7px; background: #f8faff; }
    .collection-kpi strong { display: block; color: var(--text); font-size: 21px; line-height: 1.2; }
    .collection-kpi span { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .collection-kpi.warn { border-left: 3px solid var(--yellow); }
    .collection-kpi.bad { border-left: 3px solid var(--red); }
    .collection-middle { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr); gap: 14px; }
    .collection-exceptions { display: grid; gap: 9px; align-content: start; }
    .collection-exception { padding: 11px 12px; border-left: 3px solid var(--red); border-radius: 5px; background: #fff7f8; }
    .collection-exception.warn { border-left-color: var(--yellow); background: #fffaf1; }
    .collection-exception strong { display: block; color: var(--text); }
    .collection-exception span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .collection-status-layout { display: grid; grid-template-columns: minmax(260px, .9fr) minmax(390px, 1.35fr) minmax(220px, .75fr); gap: 14px; align-items: center; }
    .collection-status-chart { width: 100%; height: 230px; }
    .collection-status-note { display: grid; gap: 12px; padding: 14px; border-left: 3px solid var(--blue); border-radius: 6px; background: #f7f9fe; }
    .collection-status-note strong { color: var(--text); font-size: 24px; }
    .collection-status-note span { color: var(--muted); font-size: 11px; line-height: 1.6; }
    .collection-status-note .warn-text { color: #a66f09; }
    .collection-status-summary { display: grid; grid-template-columns: minmax(260px, .85fr) minmax(320px, 1.1fr) minmax(220px, .7fr); gap: 22px; align-items: center; }
    .collection-status-bars { display: grid; gap: 16px; padding: 8px 4px; }
    .collection-status-row { display: grid; grid-template-columns: 76px 1fr 108px; gap: 12px; align-items: center; }
    .collection-status-row strong { color: #42516a; font-size: 12px; }
    .collection-status-track { display: flex; height: 14px; overflow: hidden; border-radius: 7px; background: #edf1f6; }
    .collection-status-track i { display: block; min-width: 4px; height: 100%; }
    .collection-status-track .ok { background: #72c99b; }
    .collection-status-track .warn { background: #e5b347; }
    .collection-status-track .bad { background: #dd6673; }
    .collection-status-count { color: var(--muted); text-align: right; font-size: 11px; }
    .collection-status-legend { display: flex; gap: 16px; margin-top: 18px; color: var(--muted); font-size: 11px; }
    .collection-status-legend span::before { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 2px; background: var(--legend); content: ''; }
    .collection-overview-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 16px; border: 1px solid #e5eaf2; border-radius: 7px; background: #f8faff; }
    .collection-overview-conclusion { display: flex; align-items: center; gap: 12px; }
    .collection-overview-conclusion strong { color: var(--text); font-size: 15px; }
    .collection-overview-conclusion span { color: var(--muted); font-size: 11px; }
    .collection-overview-metrics { display: flex; gap: 18px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .collection-overview-metrics strong { margin-left: 4px; color: var(--text); font-size: 14px; }
    .collection-overview-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, .65fr); gap: 16px; align-items: stretch; }
    .collection-overview-chart { width: 100%; height: 260px; }
    .collection-domain-list { display: grid; gap: 8px; }
    .collection-domain-row { display: grid; grid-template-columns: 86px 64px 1fr 70px; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid #edf1f6; }
    .collection-domain-row:last-child { border-bottom: 0; }
    .collection-domain-row strong { color: #42516a; font-size: 12px; }
    .collection-domain-row span { color: var(--muted); font-size: 11px; }
    .collection-domain-row .domain-impact { color: #a66f09; }
    .collection-page .panel { border-color: #e4eaf3; box-shadow: 0 5px 18px rgba(31, 55, 94, .055); }
    .collection-page .panel-head h2 { color: #20304a; letter-spacing: .2px; }
    .collection-page .panel-head .caption { color: #78869c; }
    .collection-page .status.yellow { color: #76500a; border: 1px solid #f0cf78; background: #fff3cf; }
    .collection-overview-head { border-color: #dce7f6; background: linear-gradient(105deg, #f5f9ff 0%, #fbfdff 64%, #f4f8ff 100%); box-shadow: inset 3px 0 0 #e5b347; }
    .collection-overview-conclusion .status { padding: 5px 9px; border-radius: 5px; font-weight: 600; }
    .collection-overview-conclusion strong { letter-spacing: .1px; }
    .collection-overview-conclusion span { display: block; margin-top: 4px; }
    .collection-overview-metrics { padding-left: 20px; border-left: 1px solid #dce5f2; }
    .collection-overview-metrics span { display: inline-flex; align-items: baseline; }
    .collection-overview-metrics strong { color: #203b66; }
    .collection-overview-grid .panel { min-height: 332px; }
    .collection-overview-grid .panel-head { margin-bottom: 4px; }
    .collection-overview-chart { height: 278px; }
    .collection-result-panel { display: grid; grid-template-columns: 145px 1fr; gap: 22px; align-items: center; min-height: 238px; padding: 12px 16px; }
    .collection-success-rate { display: grid; place-items: center; width: 132px; height: 132px; border: 9px solid #dff2e8; border-top-color: #72c99b; border-right-color: #72c99b; border-radius: 50%; transform: rotate(-28deg); }
    .collection-success-rate-content { display: grid; place-items: center; transform: rotate(28deg); }
    .collection-success-rate strong { color: #1e8a5a; font-size: 25px; line-height: 1; }
    .collection-success-rate span { margin-top: 7px; color: #71809a; font-size: 11px; }
    .collection-result-detail { position: relative; display: grid; gap: 14px; padding-top: 28px; }
    .collection-result-detail > strong { color: #20304a; font-size: 14px; }
    .collection-result-track { display: flex; height: 18px; overflow: hidden; border-radius: 9px; background: #edf1f6; box-shadow: inset 0 1px 2px rgba(31, 55, 94, .08); }
    .collection-result-track i { display: block; min-width: 6px; height: 100%; }
    .collection-result-track .ok { background: linear-gradient(90deg, #65bd91, #87d2aa); }
    .collection-result-track .warn { background: #e5b347; }
    .collection-result-track .bad { background: #dd6673; }
    .collection-result-legend { position: absolute; top: 0; right: 0; display: flex; gap: 16px; }
    .collection-result-legend span { color: #71809a; font-size: 11px; }
    .collection-result-legend span::before { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 2px; background: var(--legend); content: ''; }
    @media (max-width: 700px) { .collection-result-panel { grid-template-columns: 1fr; justify-items: center; } .collection-result-detail { width: 100%; } }
    .collection-domain-heatmap { width: 100%; height: 260px; }
    .metrics-overview-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, .65fr); gap: 16px; align-items: stretch; }
    .metrics-overview-grid .panel { min-height: 332px; }
    .metrics-overview-chart { width: 100%; height: 278px; }
    .metrics-domain-chart { width: 100%; height: 278px; }
    .metrics-domain-status { position: relative; display: grid; gap: 16px; padding: 38px 4px 8px; }
    .metrics-domain-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); grid-template-areas: 'label track' 'meta meta'; gap: 7px 12px; align-items: center; }
    .metrics-domain-row > strong { grid-area: label; color: #42516a; font-size: 12px; }
    .metrics-domain-track { grid-area: track; display: flex; height: 14px; overflow: hidden; border-radius: 7px; background: #edf1f6; }
    .metrics-domain-track i { display: block; min-width: 4px; height: 100%; }
    .metrics-domain-track .ready { background: #72c99b; }
    .metrics-domain-track .warn { background: #e5b347; }
    .metrics-domain-track .bad { background: #dd6673; }
    .metrics-domain-track .unknown { background: #aeb9c8; }
    .metrics-domain-count { grid-area: meta; display: flex; gap: 16px; padding-left: 100px; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .metrics-domain-count strong { color: #42516a; font-size: 11px; font-weight: 600; }

        notifications: { 渠道: '通知渠道', 状态: '发送状态', 操作: '操作入口' }
      };

    function bind() {
      document.querySelectorAll('[data-module]').forEach(el => el.addEventListener('click', () => { state.module = el.dataset.module; state.page = 1; render(); }));

      if (scope) scope.addEventListener('change', e => { state.scope = e.target.value; toast('已切换数据范围：' + state.scope); render(); });
      if (timeWindow) timeWindow.addEventListener('change', e => { state.window = e.target.value; toast('已切换时间窗口：' + state.window); render(); });
      const autoRefresh = document.getElementById('autoRefresh');
      if (autoRefresh) autoRefresh.addEventListener('click', () => { autoRefreshEnabled = !autoRefreshEnabled; toast(autoRefreshEnabled ? '已开启总览自动刷新' : '已关闭总览自动刷新'); render(); });
      const collectionAddAction = state.module === 'collection' && document.getElementById('addAction');
      if (collectionAddAction) collectionAddAction.remove();
      document.querySelectorAll('#refresh, #refreshCollection, #refreshMetrics, #refreshTasks, #refreshAlerts, #refreshEvents, #search, #reset, #dataInfo, #metricInfo, #taskInfo, #alertInfo, #eventInfo, #noticeInfo, #analysisInfo, #addAction').forEach(el => el.addEventListener('click', () => { if ((el.id === 'refresh' || el.id === 'refreshCollection') && window.refreshOverviewCharts) window.refreshOverviewCharts(); if ((el.id === 'refresh' || el.id === 'refreshCollection') && window.refreshCollectionCharts) window.refreshCollectionCharts(); if ((el.id === 'refresh' || el.id === 'refreshMetrics') && window.refreshMetricsCharts) window.refreshMetricsCharts(); if ((el.id === 'refresh' || el.id === 'refreshTasks') && window.refreshTasksCharts) window.refreshTasksCharts(); if ((el.id === 'refresh' || el.id === 'refreshAlerts') && window.refreshAlertCharts) window.refreshAlertCharts(); if ((el.id === 'refresh' || el.id === 'refreshEvents') && window.refreshEventCharts) window.refreshEventCharts(); toast(el.id === 'dataInfo' || el.id === 'metricInfo' || el.id === 'alertInfo' || el.id === 'eventInfo' || el.id === 'noticeInfo' || el.id === 'analysisInfo' ? '统计数据来自事件、指标和告警接口，当前范围：' + state.scope + '，窗口：' + state.window : el.id === 'taskInfo' ? '任务状态来自任务和 Worker 统计接口，当前范围：' + state.scope + '，窗口：' + state.window : el.id === 'addAction' ? '原型演示：打开新增配置表单' : '已刷新，数据状态：ready'); }));
      const addChannel = document.getElementById('addChannel'); if (addChannel) addChannel.addEventListener('click', () => showNoticeForm('channel'));

      document.querySelectorAll('[data-analysis-view]').forEach(el => el.addEventListener('click', () => { state.analysisView = el.dataset.analysisView; render(); }));
      document.querySelectorAll('[data-analysis-session]').forEach(el => el.addEventListener('click', () => { document.querySelectorAll('[data-analysis-session]').forEach(item => item.classList.remove('active')); el.classList.add('active'); toast('已切换分析会话：' + el.textContent.replace(/\s+/g, ' ').trim()); }));
      const analysisNewChat = document.getElementById('analysisNewChat'); if (analysisNewChat) analysisNewChat.addEventListener('click', () => toast('原型演示：已创建新的分析会话，等待选择异常上下文'));
      document.querySelectorAll('[data-rule]').forEach(el => el.addEventListener('click', () => showRule(Number(el.dataset.rule))));
      const addRule = document.getElementById('addRule'); if (addRule) addRule.addEventListener('click', () => showRule(-1));
      document.querySelectorAll('[data-task]').forEach(el => el.addEventListener('click', () => showTask(Number(el.dataset.task))));
      document.querySelectorAll('[data-event]').forEach(el => el.addEventListener('click', () => showEvent(Number(el.dataset.event))));
      document.querySelectorAll('[data-metric], [data-collection], [data-notice], [data-audit], [data-permission]').forEach(el => el.addEventListener('click', () => showGeneric(el.dataset)));
    }
    function showAlert(index) { const item = alerts[index] || alerts[0]; const actions = item.status === 'firing' ? '<button class="btn primary" data-action="ack">确认告警</button><button class="btn" data-action="suppress">抑制告警</button><button class="btn" data-action="note">添加备注</button>' : item.status === 'acknowledged' ? '<button class="btn primary" data-action="suppress">抑制告警</button><button class="btn" data-action="close">关闭告警</button><button class="btn" data-action="note">添加备注</button>' : item.status === 'resolved' ? '<button class="btn" data-action="close">关闭告警</button><button class="btn" data-action="note">添加备注</button>' : '<span class="caption">告警已关闭，仅支持查看和审计追溯</span>'; showDrawer(`<div class="drawer-head"><div><h2>${item.title}</h2><span class="status ${item.levelClass}">${item.level}</span></div><button class="close">×</button></div><dl class="detail-grid"><dt>当前状态</dt><dd>${statusTag(item.status)}</dd><dt>告警规则</dt><dd>${item.rule}</dd><dt>监控域</dt><dd>${item.domain}</dd><dt>资源类型</dt><dd>${item.resourceType}</dd><dt>资源名称</dt><dd>${item.resource}</dd><dt>当前值 / 阈值</dt><dd>${item.current} / ${item.threshold}</dd><dt>统计窗口</dt><dd>连续 3 个周期 · 样本数 128</dd><dt>首次发生</dt><dd>${item.first}</dd><dt>最近发生</dt><dd>${item.last}</dd><dt>恢复时间</dt><dd>${item.recovery}</dd></dl><div class="drawer-section"><h3>关联证据</h3><p class="caption">指标：${item.domain === '知识库问答' ? 'qa_p95' : 'worker_heartbeat'}　事件：event-8831　任务：eval-run-20260730-09　Trace ID：trace-7ac9</p></div><div class="drawer-section"><h3>处理记录</h3><div class="timeline"><div class="timeline-row"><span class="timeline-time">${item.first.slice(11, 16)}</span><i class="timeline-mark"></i><div class="timeline-text"><strong>告警触发</strong><span>${item.rule} · 系统自动判定</span></div><span class="caption">规则命中</span></div><div class="timeline-row"><span class="timeline-time">${item.status === 'acknowledged' ? '09:24' : item.status === 'resolved' ? '09:02' : '—'}</span><i class="timeline-mark"></i><div class="timeline-text"><strong>${item.status === 'acknowledged' ? '人工确认' : item.status === 'resolved' ? '指标恢复' : '等待处理'}</strong><span>${item.owner === '—' ? '尚未记录处理人' : item.owner}</span></div><span class="caption">${item.status === 'firing' ? '待处理' : '已记录'}</span></div></div></div><div class="drawer-section"><h3>处理操作</h3>${actions}</div>`); }
    function showRule(index) { const item = alertRules[index] || { name: '', domain: '知识库问答', level: '警告', expression: '', window: '连续 3 个周期', recovery: '连续 3 个周期恢复', status: '启用', version: '草稿', updated: '未发布' }; const editing = index >= 0; showDrawer(`<div class="drawer-head"><div><h2>${editing ? '编辑规则' : '新增规则'}</h2><span class="caption">${editing ? item.name : '配置确定性触发和恢复条件'}</span></div><button class="close">×</button></div><div class="form-grid"><label>规则名称<input class="text-input" value="${item.name}" placeholder="请输入规则名称" /></label><label>监控域<select class="control"><option>${item.domain}</option><option>知识库问答</option><option>平台运行</option><option>异步任务</option><option>自主评测</option></select></label><label>告警级别<select class="control"><option>${item.level}</option><option>严重</option><option>警告</option><option>提示</option></select></label><label>规则状态<select class="control"><option>${item.status}</option><option>启用</option><option>停用</option></select></label><label class="full">触发表达式<input class="text-input" value="${item.expression}" placeholder="例如 qa_p95 > 1.5s" /></label><label>触发窗口<select class="control"><option>${item.window}</option><option>单次计算</option><option>连续 2 个周期</option><option>连续 3 个周期</option></select></label><label>恢复条件<input class="text-input" value="${item.recovery}" /></label></div><div class="drawer-section"><h3>生效说明</h3><p class="caption">保存后生成新版本，规则变更记录写入审计；停用规则不会删除历史告警实例。</p></div><div class="drawer-section drawer-actions"><button class="btn" data-action="cancel">取消</button><button class="btn primary" data-action="save-rule">保存并发布</button></div>`); }
    function showNoticeForm(type) { const isChannel = type === 'channel'; showDrawer(`<div class="drawer-head"><div><h2>${isChannel ? '新增渠道' : '新增策略'}</h2><span class="caption">${isChannel ? '配置告警通知发送通道和接收范围' : '配置告警生命周期、级别和接收范围'}</span></div><button class="close">×</button></div><div class="form-grid">${isChannel ? '<label>渠道名称<input class="text-input" placeholder="例如 值班 Webhook" /></label><label>渠道类型<select class="control"><option>Webhook</option><option>站内通知</option></select></label><label class="full">发送地址<input class="text-input" placeholder="请输入 Webhook 地址或站内通知标识" /></label><label>渠道状态<select class="control"><option>启用</option><option>停用</option></select></label><label>接收范围<select class="control"><option>监控值班组</option><option>平台管理员</option><option>租户管理员</option></select></label>' : '<label>策略名称<input class="text-input" placeholder="例如 严重告警通知" /></label><label>告警级别<select class="control"><option>严重</option><option>警告</option><option>提示</option></select></label><label>监控域<select class="control"><option>全部</option><option>知识库问答</option><option>平台运行</option><option>异步任务</option><option>自主评测</option></select></label><label>通知渠道<select class="control"><option>站内通知 + Webhook</option><option>站内通知</option><option>Webhook</option></select></label><label>触发事件<select class="control"><option>触发 / 持续 / 恢复</option><option>仅触发</option><option>触发 / 恢复</option></select></label><label>接收范围<select class="control"><option>当前租户</option><option>全平台</option><option>监控值班组</option></select></label>'}</div><div class="drawer-section"><h3>生效说明</h3><p class="caption">保存后生成配置版本并写入审计；通知发送失败只更新发送记录，不影响告警实例。</p></div><div class="drawer-section drawer-actions"><button class="btn" data-action="cancel">取消</button><button class="btn primary" data-action="save-notice">保存并启用</button></div>`); }
    function showTask(index) { const row = taskRows[index] || taskRows[0]; showDrawer(`<div class="drawer-head"><div><h2>${row[0]}</h2><span class="status blue">${row[1]}</span></div><button class="close">×</button></div><dl class="detail-grid"><dt>任务状态</dt><dd>${statusTag(row[2])}</dd><dt>Worker</dt><dd>${row[3]}</dd><dt>进度</dt><dd>${row[4]}</dd><dt>等待时长</dt><dd>${row[5]}</dd><dt>数据范围</dt><dd>${state.scope}</dd></dl><div class="drawer-section"><h3>Agent 执行证明</h3><div class="timeline">${['Worker 领取评测运行','评测运行进入 running','配置校验完成','Agent 开始执行','问题 12 完成并计算指标'].map((x,i) => `<div class="timeline-row"><span class="timeline-time">09:${28-i} :${10+i}</span><i class="timeline-mark"></i><div class="timeline-text"><strong>${x}</strong><span>stage-${i+1} · trace-7ac9 · duration 320ms</span></div><span class="status green">完成</span></div>`).join('')}</div></div>`); }
    function showEvent(index) { const row = eventRows[index] || eventRows[0]; showDrawer(`<div class="drawer-head"><div><h2>${row[2]}</h2><span class="caption">事件详情</span></div><button class="close">×</button></div><dl class="detail-grid"><dt>事件 ID</dt><dd>event-883${index}</dd><dt>发生时间</dt><dd>2026年07月30日 ${row[0]}</dd><dt>事件类型</dt><dd>${row[1]}</dd><dt>资源</dt><dd>${row[3]}</dd><dt>状态</dt><dd>${row[4]}</dd><dt>Trace ID</dt><dd>trace-7ac9</dd><dt>脱敏上下文</dt><dd>只展示运行 ID、耗时、阶段和计数，不展示完整问题、答案和文档片段。</dd></dl>`); }
    function showGeneric(data) {
      if (data.collection) {
        const targets = [
          ['问答 API', '通用采集', '09:30:20', '42ms', '正常', '问答请求和响应状态已按周期上报，数据可用于问答指标统计。', '无异常', '知识库问答链路'],
          ['评测 Worker', '周期采集', '09:30:12', '—', '部分失败', 'Worker 心跳已上报，但本周期部分运行明细未到达。', '心跳数据不完整', '自主评测运行'],
          ['向量服务', '依赖探针', '09:28:14', '1.2s', '获取失败', '依赖探针未能获取完整响应，最近一次成功结果仍保留。', '向量服务探针超时', '外部依赖'],
          ['数据库连接池', '容量探针', '09:30:18', '18ms', '正常', '连接池使用量和等待数已完成本周期采集。', '无异常', '平台资源']
        ];
        const target = targets[Number(data.collection) || 0];
        const status = target[4] === '正常' ? 'completed' : target[4] === '部分失败' ? 'firing' : 'failed';
        showDrawer(`<div class="drawer-head"><div><h2>目标详情</h2><span class="caption">只读查看采集结果与异常证据</span></div><button class="close">×</button></div><section class="drawer-section"><h3>运行信息</h3><dl class="detail-grid"><dt>目标名称</dt><dd>${target[0]}</dd><dt>采集类型</dt><dd>${target[1]}</dd><dt>最近采集</dt><dd>${target[2]}</dd><dt>采集耗时</dt><dd>${target[3]}</dd><dt>数据状态</dt><dd>${statusTag(status)}</dd></dl></section><section class="drawer-section"><h3>状态说明</h3><dl class="detail-grid"><dt>采集结论</dt><dd>${target[5]}</dd><dt>最近异常</dt><dd>${target[6]}</dd><dt>影响范围</dt><dd>${target[7]}</dd><dt>当前范围</dt><dd>${state.scope}</dd></dl></section><section class="drawer-section"><h3>事件追溯</h3><p class="caption">可前往事件中心查看该目标的采集事件、失败原因和关联 Trace；此处不提供采集配置或执行操作。</p><button class="btn text" data-module="events">查看采集事件 →</button></section>`);
        return;
      }
      if (data.audit) {
        const auditItems = [
          { time: '2026年07月30日 09:30:26', operator: '林管理员', type: '确认告警', resource: 'alert-10021', resourceName: 'Worker 心跳过期', scope: '全平台', result: '操作成功', trace: 'trace-audit-903026', before: '触发中（firing）', after: '已确认（acknowledged）', reason: '确认告警状态，进入人工跟进' },
          { time: '2026年07月30日 09:28:20', operator: '林管理员', type: '查询指标', resource: 'metric.qa_p95', resourceName: '问答 P95', scope: '全平台', result: '查询成功', trace: 'trace-audit-902820', before: '—', after: '查看最近1小时指标', reason: '核对问答性能异常' },
          { time: '2026年07月30日 09:18:34', operator: '系统', type: '触发告警', resource: 'alert-10021', resourceName: 'Worker 心跳过期', scope: '全平台', result: '记录成功', trace: 'trace-audit-901834', before: '规则未命中', after: '触发中（firing）', reason: '连续 3 个周期超过心跳年龄阈值' }
        ];
        const item = auditItems[Number(data.audit)] || auditItems[0];
        showDrawer(`<div class="drawer-head"><div><h2>审计详情</h2><span class="caption">${item.type} · ${item.time}</span></div><button class="close">×</button></div><div class="audit-detail-summary"><div class="audit-detail-summary-item"><span>操作类型</span><strong>${item.type}</strong></div><div class="audit-detail-summary-item"><span>操作结果</span><strong class="status green">${item.result}</strong></div><div class="audit-detail-summary-item"><span>操作时间</span><strong>${item.time.slice(11)}</strong></div></div><section class="audit-detail-section"><h3>基本信息</h3><dl class="detail-grid"><dt>操作者</dt><dd>${item.operator}</dd><dt>操作时间</dt><dd>${item.time}</dd><dt>请求 Trace</dt><dd>${item.trace}</dd><dt>数据范围</dt><dd>${item.scope}</dd></dl></section><section class="audit-detail-section"><h3>操作对象</h3><dl class="detail-grid"><dt>资源标识</dt><dd>${item.resource}</dd><dt>资源名称</dt><dd>${item.resourceName}</dd><dt>操作结果</dt><dd><span class="status green">${item.result}</span></dd></dl></section><section class="audit-detail-section"><h3>状态变化</h3><div class="audit-change"><div class="audit-change-row"><span>状态字段</span><strong>操作前</strong><span class="audit-change-arrow">→</span><strong>操作后</strong></div><div class="audit-change-row"><span>记录状态</span><span>${item.before}</span><span class="audit-change-arrow">→</span><span>${item.after}</span></div></div></section><section class="audit-detail-section"><h3>操作说明</h3><p class="audit-detail-note">${item.reason}。审计记录仅用于追溯，不会在详情页重复执行该操作。</p></section>`);
        return;
      }
      const label = data.metric ? '指标详情' : data.notice ? '通知详情' : data.audit ? '审计详情' : '详情';
      showDrawer(`<div class="drawer-head"><div><h2>${label}</h2><span class="caption">原型演示数据</span></div><button class="close">×</button></div><dl class="detail-grid"><dt>当前范围</dt><dd>${state.scope}</dd><dt>数据状态</dt><dd>${statusTag('completed')}</dd><dt>更新时间</dt><dd>2026年07月30日 09:30:20</dd><dt>审计要求</dt><dd>查询和配置变更均记录操作者、范围、时间和结果。</dd><dt>安全边界</dt><dd>敏感内容按权限脱敏，页面不展示密码、Token、API Key 或完整业务内容。</dd></dl>`);
    }
    function showDrawer(html) { const drawer = document.getElementById('drawer'); drawer.innerHTML = html.replaceAll('平台管理员', '平台超级管理员').replaceAll('监控值班组', '平台超级管理员'); document.getElementById('drawerMask').classList.add('show'); drawer.querySelector('.close').addEventListener('click', closeDrawer); drawer.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', () => { toast('原型演示：操作已提交并记录审计'); closeDrawer(); })); }
    function closeDrawer() { document.getElementById('drawerMask').classList.remove('show'); }
    function toast(message) { const el = document.getElementById('toast'); el.textContent = message; el.classList.add('show'); window.clearTimeout(window.toastTimer); window.toastTimer = window.setTimeout(() => el.classList.remove('show'), 2200); }
    document.getElementById('drawerMask').addEventListener('click', e => { if (e.target.id === 'drawerMask') closeDrawer(); });
    render();
  </script>
