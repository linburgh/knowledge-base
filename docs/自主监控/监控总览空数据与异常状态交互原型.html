<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>监控总览 · 空数据与异常状态交互原型</title>
    <style>
      :root {
        --navy: #151f34;
        --navy-light: #263a5f;
        --background: #f4f6fa;
        --panel: #ffffff;
        --text: #243553;
        --muted: #8290a7;
        --line: #e5eaf2;
        --primary: #5d6df6;
        --primary-light: #eef0ff;
        --green: #62c49a;
        --yellow: #e6b53f;
        --red: #dd6673;
        --gray: #aeb7c6;
        --blue: #5d91e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        background: var(--background);
        font: 13px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      button,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 232px;
        color: #c8d2e5;
        background: var(--navy);
      }

      .brand {
        display: flex;
        height: 68px;
        align-items: center;
        gap: 12px;
        padding: 0 26px;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        color: #17334b;
        border-radius: 10px;
        background: #8ce7c4;
      }

      .nav {
        padding: 28px 18px;
      }

      .nav-item {
        padding: 12px 14px;
        color: #fff;
        border-radius: 8px;
        background: var(--navy-light);
        font-size: 14px;
      }

      .version {
        position: absolute;
        bottom: 24px;
        left: 24px;
        color: #71809b;
        font-size: 11px;
      }

      .workspace {
        width: calc(100% - 232px);
        min-width: 980px;
        margin-left: 232px;
      }

      .topbar {
        display: flex;
        height: 68px;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .crumb {
        color: #8794a9;
      }

      .crumb strong {
        margin-left: 12px;
        color: #485976;
      }

      .account {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #52617a;
      }

      .avatar {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        color: #fff;
        border-radius: 50%;
        background: var(--primary);
      }

      .content {
        padding: 28px 32px 42px;
      }

      .review-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 12px 14px;
        margin-bottom: 18px;
        border: 1px solid #d9defc;
        border-radius: 8px;
        background: #f8f9ff;
      }

      .review-copy {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #68758e;
      }

      .review-copy strong {
        color: #4657d8;
      }

      .scenario-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .scenario-tab {
        padding: 6px 11px;
        color: #64728a;
        border: 1px solid #d8deea;
        border-radius: 5px;
        background: #fff;
      }

      .scenario-tab.active {
        color: #fff;
        border-color: var(--primary);
        background: var(--primary);
      }

      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
      }

      .page-head h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }

      .page-head p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .control,
      .button {
        height: 34px;
        padding: 0 12px;
        color: #52617a;
        border: 1px solid #d8dfeb;
        border-radius: 6px;
        background: #fff;
      }

      .button.primary {
        color: #fff;
        border-color: var(--primary);
        background: var(--primary);
      }

      .button.text {
        height: auto;
        padding: 0;
        color: #5969e5;
        border: 0;
        background: transparent;
      }

      .state-banner {
        display: flex;
        min-height: 58px;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        margin-bottom: 16px;
        border: 1px solid #dfe5ee;
        border-radius: 8px;
        background: #fff;
      }

      .state-banner.normal {
        color: #fff;
        border-color: #4a263f;
        background: linear-gradient(100deg, #4f233e, #2b284c);
      }

      .state-banner.empty {
        border-color: #dce4f0;
        background: #f8fafd;
      }

      .state-banner.error {
        border-color: #f2c8cd;
        background: #fff7f8;
      }

      .state-banner.partial {
        border-color: #efdca7;
        background: #fffaf0;
      }

      .banner-tag,
      .state-tag {
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 11px;
        white-space: nowrap;
      }

      .normal .banner-tag {
        color: #fff;
        background: var(--red);
      }

      .empty .banner-tag {
        color: #5b6a82;
        background: #e8edf4;
      }

      .error .banner-tag,
      .state-tag.error {
        color: #b43f4b;
        background: #ffe3e6;
      }

      .partial .banner-tag,
      .state-tag.stale {
        color: #95680d;
        background: #fff0c7;
      }

      .banner-main {
        flex: 1;
      }

      .banner-main strong {
        display: block;
      }

      .banner-main span {
        color: #7d8ba1;
        font-size: 11px;
      }

      .state-banner.normal .banner-main span {
        color: #d9d6e5;
      }

      .panel {
        padding: 18px;
        margin-bottom: 16px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        box-shadow: 0 3px 12px rgb(49 65 95 / 4%);
      }

      .panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .panel-head h2 {
        margin: 0 0 3px;
        font-size: 15px;
      }

      .panel-head p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .panel-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 11px;
      }

      .legend {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 14px;
        white-space: nowrap;
      }

      .legend i {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 5px;
        border-radius: 2px;
        background: var(--legend-color);
      }

      .module-state {
        display: grid;
        min-height: 170px;
        place-items: center;
        padding: 24px;
        border: 1px dashed #dbe2ec;
        border-radius: 7px;
        background: #fbfcfe;
        text-align: center;
      }

      .module-state.compact {
        min-height: 118px;
      }

      .module-state.error {
        border-color: #edc7cc;
        background: #fffafb;
      }

      .module-state.stale {
        border-color: #ead9aa;
        background: #fffdf7;
      }

      .state-content {
        max-width: 430px;
      }

      .state-icon {
        display: grid;
        width: 42px;
        height: 42px;
        margin: 0 auto 10px;
        place-items: center;
        color: #8190a7;
        border: 1px solid #d6deea;
        border-radius: 50%;
        background: #fff;
        font-size: 18px;
      }

      .module-state.error .state-icon {
        color: #c94f5c;
        border-color: #efc5ca;
        background: #fff3f4;
      }

      .module-state.stale .state-icon {
        color: #a87916;
        border-color: #ead59d;
        background: #fff8e5;
      }

      .state-content strong {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }

      .state-content p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .state-detail {
        display: block;
        margin-top: 7px;
        color: #9aa5b6;
        font-size: 11px;
      }

      .state-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 13px;
      }

      .business-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .business-item {
        display: flex;
        min-height: 76px;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 13px 15px;
        border-left: 3px solid var(--green);
        border-radius: 6px;
        background: #f8faff;
      }

      .business-item.warning {
        border-left-color: var(--yellow);
      }

      .business-item.unavailable {
        border-left-color: var(--gray);
        background: #f7f8fa;
      }

      .business-item strong,
      .business-item span {
        display: block;
      }

      .business-item span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
      }

      .business-value {
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
      }

      .chart-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .chart-shell {
        position: relative;
        min-height: 220px;
        padding: 22px 22px 30px 44px;
        border-left: 1px solid #c9d1de;
        border-bottom: 1px solid #c9d1de;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 51px,
          #edf1f6 52px
        );
      }

      .line-chart {
        position: absolute;
        inset: 38px 18px 24px 38px;
        width: calc(100% - 56px);
        height: calc(100% - 62px);
      }

      .alert-status-summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }

      .alert-status-metric {
        padding: 9px 6px;
        border: 1px solid #e3e8ef;
        border-radius: 4px;
        background: #fafbfd;
        text-align: center;
      }

      .alert-status-metric strong,
      .alert-status-metric span,
      .alert-status-info strong,
      .alert-status-info span {
        display: block;
      }

      .alert-status-metric strong {
        color: #526178;
        font-size: 19px;
      }

      .alert-status-metric span,
      .alert-status-info span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
      }

      .alert-status-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .alert-status-table th,
      .alert-status-table td {
        padding: 9px 10px;
        border: 1px solid #e0e5ec;
        text-align: left;
      }

      .alert-status-table th {
        color: #4d5c72;
        background: #f5f7fa;
      }

      .resource-bars {
        display: grid;
        gap: 18px;
        padding: 16px 8px;
      }

      .resource-row {
        display: grid;
        grid-template-columns: 70px 1fr 42px;
        align-items: center;
        gap: 10px;
        color: #64728a;
        font-size: 11px;
      }

      .track {
        height: 14px;
        overflow: hidden;
        border-radius: 7px;
        background: #edf1f6;
      }

      .track i {
        display: block;
        height: 100%;
        border-radius: 7px;
        background: var(--bar-color);
      }

      .runtime-table {
        display: grid;
        grid-template-columns: 92px repeat(12, minmax(28px, 1fr));
        gap: 3px;
        align-items: center;
      }

      .runtime-label,
      .runtime-time {
        color: #6d7b91;
        font-size: 10px;
      }

      .runtime-label {
        padding-right: 8px;
        font-weight: 600;
        text-align: right;
      }

      .runtime-time {
        padding-top: 5px;
        text-align: center;
      }

      .runtime-cell {
        height: 24px;
        border-radius: 3px;
        background: var(--cell-color);
      }

      .propagation {
        position: relative;
        padding-top: 34px;
      }

      .propagation-axis,
      .propagation-row {
        display: grid;
        grid-template-columns: 92px repeat(6, 1fr);
        align-items: center;
      }

      .propagation-axis {
        color: #8b98ab;
        font-size: 10px;
      }

      .propagation-row {
        min-height: 48px;
        border-bottom: 1px solid #e8edf4;
      }

      .propagation-row strong {
        font-size: 11px;
      }

      .event-node {
        justify-self: center;
        padding: 5px 8px;
        color: #fff;
        border-radius: 12px;
        background: var(--node-color);
        font-size: 10px;
        white-space: nowrap;
      }

      .scenario-caption {
        margin-top: -6px;
        margin-bottom: 14px;
        color: #8290a7;
        font-size: 11px;
      }

      .toast {
        position: fixed;
        z-index: 10;
        right: 26px;
        bottom: 26px;
        padding: 10px 15px;
        color: #fff;
        border-radius: 6px;
        background: #2e3b52;
        opacity: 0;
        transform: translateY(8px);
        transition: 0.2s ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 1180px) {
        .review-bar,
        .page-head {
          align-items: flex-start;
          flex-direction: column;
        }

        .toolbar {
          justify-content: flex-start;
        }

        .business-grid,
        .chart-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">K</span>
          <span>Knowledge Base</span>
        </div>
        <nav class="nav">
          <div class="nav-item">自主监控</div>
        </nav>
        <div class="version">状态交互评审原型 · 1.0</div>
      </aside>
      <main class="workspace">
        <header class="topbar">
          <div class="crumb">企业知识库 <strong>知识服务工作台</strong></div>
          <div class="account">
            <span class="avatar">预览</span>
            <span>原型评审员</span>
          </div>
        </header>
        <div
          id="content"
          class="content"
        ></div>
      </main>
    </div>
    <div
      id="toast"
      class="toast"
    ></div>

    <script>
      const scenarios = [
        {
          code: "normal",
          label: "正常数据",
          description: "所有模块返回完整数据。",
        },
        {
          code: "empty",
          label: "全部空白",
          description: "接口成功，但当前范围和时间窗口没有任何监控数据。",
        },
        {
          code: "module-empty",
          label: "局部空白",
          description: "运行、告警和资源正常，业务状态及异常传播返回空数据。",
        },
        {
          code: "error",
          label: "接口异常",
          description: "总览请求失败，不使用 0 或本地数据伪装成功。",
        },
        {
          code: "partial",
          label: "部分过期",
          description: "部分模块失败或过期，保留最后成功快照并明确标识。",
        },
      ];

      let currentScenario = "empty";

      function scenario() {
        return scenarios.find((item) => item.code === currentScenario) || scenarios[0];
      }

      function stateBox(type, title, description, detail = "", action = "") {
        const icons = {
          empty: "—",
          error: "!",
          stale: "◷",
        };
        return `
          <div class="module-state ${type}">
            <div class="state-content">
              <span class="state-icon">${icons[type]}</span>
              <strong>${title}</strong>
              <p>${description}</p>
              ${detail ? `<span class="state-detail">${detail}</span>` : ""}
              ${
                action
                  ? `<div class="state-actions"><button class="button primary" data-action="${action}">重新加载</button><button class="button text" data-action="data-info">查看数据说明</button></div>`
                  : ""
              }
            </div>
          </div>
        `;
      }

      function panel(title, description, content, meta = "") {
        return `
          <section class="panel">
            <div class="panel-head">
              <div>
                <h2>${title}</h2>
                <p>${description}</p>
              </div>
              ${meta}
            </div>
            ${content}
          </section>
        `;
      }

      function normalRuntime() {
        const rows = [
          ["API 服务", 0],
          ["数据库", 0],
          ["模型服务", 0],
          ["向量服务", 1],
          ["监控采集", 2],
        ];
        const times = ["09:05", "09:10", "09:15", "09:20", "09:25", "09:30"];
        const cells = rows
          .map(
            ([name, status]) => `
              <span class="runtime-label">${name}</span>
              ${Array.from({ length: 12 })
                .map((_, index) => {
                  const value = index < 7 ? 0 : status;
                  const color = ["#72c99b", "#e5b347", "#dd6673"][value];
                  return `<i class="runtime-cell" style="--cell-color:${color}"></i>`;
                })
                .join("")}
            `,
          )
          .join("");
        return `
          <div class="runtime-table">
            ${cells}
            <span></span>
            ${times
              .flatMap((time) => [
                `<span class="runtime-time">${time}</span>`,
                "<span></span>",
              ])
              .join("")}
          </div>
        `;
      }

      function runtimeMeta(extra = "") {
        return `
          <div class="panel-meta">
            ${extra}
            <div class="legend">
              <span><i style="--legend-color:#72c99b"></i>正常</span>
              <span><i style="--legend-color:#e5b347"></i>预警</span>
              <span><i style="--legend-color:#dd6673"></i>故障</span>
              <span><i style="--legend-color:#aeb9c8"></i>无数据</span>
            </div>
          </div>
        `;
      }

      function normalBusiness(partial = false) {
        return `
          <div class="business-grid">
            <div class="business-item">
              <div><strong>知识库问答</strong><span>当前状态：正常 · 成功率 99.2%</span></div>
              <b class="business-value">P95 1.2s</b>
            </div>
            <div class="business-item warning">
              <div><strong>异步任务</strong><span>当前状态：积压 · 索引构建 8 个</span></div>
              <b class="business-value">最老 18分</b>
            </div>
            <div class="business-item ${partial ? "unavailable" : ""}">
              <div><strong>自主评测</strong><span>${
                partial ? "数据获取失败 · 不展示为 0" : "当前状态：运行中 · Agent 证据完整"
              }</span></div>
              <b class="business-value">${partial ? "不可用" : "运行 09"}</b>
            </div>
          </div>
        `;
      }

      function normalAlertChart() {
        return `
          <div class="alert-status-summary">
            ${[[1, "触发中"], [1, "已确认"], [1, "已恢复"], [3, "已关闭"]]
              .map(
                ([value, label]) =>
                  `<div class="alert-status-metric"><strong>${value}</strong><span>${label}</span></div>`,
              )
              .join("")}
          </div>
          <table class="alert-status-table">
            <thead><tr><th>告警信息</th><th>当前状态</th><th>最近变化</th></tr></thead>
            <tbody>
              <tr><td><div class="alert-status-info"><strong>Worker 心跳过期</strong><span>评测 Worker</span></div></td><td>严重 · 触发中</td><td>持续触发 · 09:58</td></tr>
              <tr><td><div class="alert-status-info"><strong>问答 P95 超过阈值</strong><span>知识库问答</span></div></td><td>警告 · 已确认</td><td>人工确认 · 09:52</td></tr>
              <tr><td><div class="alert-status-info"><strong>向量采集恢复</strong><span>向量服务</span></div></td><td>警告 · 已恢复</td><td>告警恢复 · 09:46</td></tr>
            </tbody>
          </table>
        `;
      }

      function normalResources() {
        const items = [
          ["连接池", 68],
          ["任务队列", 82],
          ["存储", 45],
          ["向量服务", 38],
        ];
        return `
          <div class="resource-bars">
            ${items
              .map(
                ([name, value]) => `
                  <div class="resource-row">
                    <span>${name}</span>
                    <div class="track"><i style="width:${value}%;--bar-color:${
                      value >= 80 ? "#e6b53f" : "#62c49a"
                    }"></i></div>
                    <strong>${value}%</strong>
                  </div>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function normalPropagation() {
        return `
          <div class="propagation">
            <div class="propagation-axis">
              <span>监控域 / 时间</span>
              <span>09:05</span>
              <span>09:10</span>
              <span>09:15</span>
              <span>09:20</span>
              <span>09:25</span>
              <span>09:30</span>
            </div>
            <div class="propagation-row">
              <strong>索引任务</strong>
              <span></span>
              <span class="event-node" style="--node-color:#e6b53f">任务积压</span>
            </div>
            <div class="propagation-row">
              <strong>问答链路</strong>
              <span></span><span></span>
              <span class="event-node" style="--node-color:#e6b53f">P95 预警</span>
            </div>
            <div class="propagation-row">
              <strong>评测链路</strong>
              <span></span><span></span><span></span>
              <span class="event-node" style="--node-color:#dd6673">Worker 故障</span>
            </div>
            <div class="propagation-row">
              <strong>告警链路</strong>
              <span></span><span></span><span></span><span></span>
              <span class="event-node" style="--node-color:#dd6673">告警触发</span>
            </div>
          </div>
        `;
      }

      function banner() {
        if (currentScenario === "normal") {
          return `
            <div class="state-banner normal">
              <span class="banner-tag">未恢复告警</span>
              <div class="banner-main"><strong>共 2 条：严重 1 条、警告 1 条</strong><span>当前范围：全平台 · 数据完整</span></div>
              <button class="button">查看告警</button>
            </div>
          `;
        }
        if (currentScenario === "empty" || currentScenario === "module-empty") {
          return `
            <div class="state-banner empty">
              <span class="banner-tag">当前无告警</span>
              <div class="banner-main"><strong>当前范围和时间窗口内没有未恢复告警</strong><span>接口请求成功，空数据不等同于加载失败</span></div>
              <button class="button text" data-action="adjust-filter">调整筛选范围</button>
            </div>
          `;
        }
        if (currentScenario === "error") {
          return `
            <div class="state-banner error">
              <span class="banner-tag">加载失败</span>
              <div class="banner-main"><strong>监控总览暂时无法加载</strong><span>请求编号：REQ-MON-20260731-01 · 已保留当前筛选条件</span></div>
              <button class="button primary" data-action="retry-all">重新加载</button>
            </div>
          `;
        }
        return `
          <div class="state-banner partial">
            <span class="banner-tag">数据不完整</span>
            <div class="banner-main"><strong>2 个模块不可用，1 个模块数据已过期</strong><span>已展示最后成功数据的模块会明确标注采集时间</span></div>
            <button class="button" data-action="retry-all">重试异常模块</button>
          </div>
        `;
      }

      function runtimePanel() {
        if (currentScenario === "normal" || currentScenario === "module-empty") {
          return panel(
            "运行状态",
            "服务状态时间热力图：横轴按 5 分钟展示，纵轴为服务，颜色表示状态。",
            normalRuntime(),
            runtimeMeta('<span>最近探测：2026年07月31日 14:30:20</span>'),
          );
        }
        if (currentScenario === "empty") {
          return panel(
            "运行状态",
            "服务状态时间热力图：横轴按 5 分钟展示，纵轴为服务，颜色表示状态。",
            stateBox(
              "empty",
              "暂无服务探测数据",
              "当前范围在最近 1 小时内没有产生运行状态快照。",
              "最近成功探测：暂无 · 可调整时间窗口后重新查看",
            ),
            runtimeMeta(),
          );
        }
        if (currentScenario === "error") {
          return panel(
            "运行状态",
            "服务状态时间热力图：横轴按 5 分钟展示，纵轴为服务，颜色表示状态。",
            stateBox(
              "error",
              "运行状态加载失败",
              "探测状态接口暂时不可用，没有使用本地状态替代。",
              "错误码：MONITORING_RUNTIME_UNAVAILABLE",
              "retry-module",
            ),
          );
        }
        return panel(
          "运行状态",
          "服务状态时间热力图：横轴按 5 分钟展示，纵轴为服务，颜色表示状态。",
          stateBox(
            "stale",
            "运行状态数据已过期",
            "最近一次探测结果超过允许时效，当前状态可能已经发生变化。",
            "最后成功探测：2026年07月31日 14:05:20 · 已过期 25 分钟",
            "retry-module",
          ),
          '<span class="state-tag stale">数据已过期</span>',
        );
      }

      function businessPanel() {
        if (currentScenario === "normal") {
          return panel(
            "业务状态",
            "仅展示当前是否需要关注，趋势和明细进入对应模块。",
            normalBusiness(),
          );
        }
        if (currentScenario === "partial") {
          return panel(
            "业务状态",
            "仅展示当前是否需要关注，趋势和明细进入对应模块。",
            normalBusiness(true),
            '<span class="state-tag stale">部分数据</span>',
          );
        }
        if (currentScenario === "error") {
          return panel(
            "业务状态",
            "仅展示当前是否需要关注，趋势和明细进入对应模块。",
            stateBox(
              "error",
              "业务状态加载失败",
              "问答、异步任务和自主评测状态均未成功返回。",
              "不展示为正常、异常或 0",
              "retry-module",
            ),
          );
        }
        return panel(
          "业务状态",
          "仅展示当前是否需要关注，趋势和明细进入对应模块。",
          stateBox(
            "empty",
            "暂无业务状态数据",
            "当前范围内没有问答、异步任务或自主评测运行记录。",
            "空数据仅说明当前窗口无记录，不代表业务异常",
          ),
        );
      }

      function chartPanels() {
        if (currentScenario === "normal" || currentScenario === "module-empty") {
          return `
            <div class="chart-grid">
              ${panel(
                "告警状态",
                "汇总当前状态并展示最近 3 条真实告警变化。",
                normalAlertChart(),
                '<button class="button text">查看告警详情 →</button>',
              )}
              ${panel(
                "资源容量",
                "当前使用率与预警阈值。",
                normalResources(),
                '<button class="button text">查看采集详情 →</button>',
              )}
            </div>
          `;
        }
        if (currentScenario === "empty") {
          return `
            <div class="chart-grid">
              ${panel(
                "告警状态",
                "汇总当前状态并展示最近 3 条真实告警变化。",
                stateBox(
                  "empty",
                  "当前时间窗口暂无告警变化",
                  "四类状态数字均为 0，且没有可展示的最近变化。",
                  "不使用本地数据补造告警记录",
                ),
              )}
              ${panel(
                "资源容量",
                "当前使用率与预警阈值。",
                stateBox(
                  "empty",
                  "暂无资源容量数据",
                  "当前范围内没有可展示的容量采样。",
                  "未采集到的数据不显示为 0%",
                ),
              )}
            </div>
          `;
        }
        if (currentScenario === "error") {
          return `
            <div class="chart-grid">
              ${panel(
                "告警状态",
                "汇总当前状态并展示最近 3 条真实告警变化。",
                stateBox(
                  "error",
                  "告警状态加载失败",
                  "告警统计与最近变化暂时不可用。",
                  "错误码：MONITORING_ALERT_STATUS_ERROR",
                  "retry-module",
                ),
              )}
              ${panel(
                "资源容量",
                "当前使用率与预警阈值。",
                stateBox(
                  "error",
                  "资源容量加载失败",
                  "资源统计接口请求失败。",
                  "错误码：MONITORING_RESOURCE_ERROR",
                  "retry-module",
                ),
              )}
            </div>
          `;
        }
        return `
          <div class="chart-grid">
            ${panel(
              "告警状态",
              "汇总当前状态并展示最近 3 条真实告警变化。",
              stateBox(
                "stale",
                "告警状态数据已过期",
                "当前状态来自最后一次成功加载，最新告警变化可能不完整。",
                "最后成功统计：2026年07月31日 14:10:00",
                "retry-module",
              ),
              '<span class="state-tag stale">快照数据</span>',
            )}
            ${panel(
              "资源容量",
              "当前使用率与预警阈值。",
              stateBox(
                "error",
                "资源容量暂不可用",
                "资源统计接口连续两次请求失败。",
                "最近成功数据未达到可展示条件",
                "retry-module",
              ),
              '<span class="state-tag error">加载失败</span>',
            )}
          </div>
        `;
      }

      function propagationPanel() {
        if (currentScenario === "normal") {
          return panel(
            "异常传播",
            "只保留一条主链路，表达异常起点、影响传播、告警触发和恢复状态。",
            normalPropagation(),
            '<button class="button text">查看事件详情 →</button>',
          );
        }
        if (currentScenario === "error") {
          return panel(
            "异常传播",
            "只保留一条主链路，表达异常起点、影响传播、告警触发和恢复状态。",
            stateBox(
              "error",
              "异常传播加载失败",
              "关联事件和 Trace 数据未成功返回。",
              "不会使用其他模块数据推测传播关系",
              "retry-module",
            ),
          );
        }
        if (currentScenario === "partial") {
          return panel(
            "异常传播",
            "只保留一条主链路，表达异常起点、影响传播、告警触发和恢复状态。",
            stateBox(
              "stale",
              "传播链路证据不完整",
              "已获取告警和任务事件，但 Trace 关联数据暂不可用。",
              "可确认异常起点，影响范围仍待补充",
              "retry-module",
            ),
            '<span class="state-tag stale">证据不完整</span>',
          );
        }
        return panel(
          "异常传播",
          "只保留一条主链路，表达异常起点、影响传播、告警触发和恢复状态。",
          stateBox(
            "empty",
            "当前时间窗口暂无异常传播",
            "系统会在发现跨模块影响时自动补充传播节点。",
            "没有传播链路不代表监控采集失败",
          ),
          '<button class="button text">查看事件详情 →</button>',
        );
      }

      function render() {
        const selected = scenario();
        document.getElementById("content").innerHTML = `
          <section class="review-bar">
            <div class="review-copy">
              <strong>评审场景</strong>
              <span>${selected.description}</span>
            </div>
            <div class="scenario-tabs">
              ${scenarios
                .map(
                  (item) => `
                    <button
                      class="scenario-tab ${item.code === currentScenario ? "active" : ""}"
                      data-scenario="${item.code}"
                    >
                      ${item.label}
                    </button>
                  `,
                )
                .join("")}
            </div>
          </section>

          <header class="page-head">
            <div>
              <h1>监控总览</h1>
              <p>在同一页面明确区分空数据、加载失败、部分失败和数据过期。</p>
            </div>
            <div class="toolbar">
              <select class="control"><option>全平台</option><option>当前租户</option></select>
              <select class="control"><option>最近1小时</option><option>最近6小时</option></select>
              <button class="button" data-action="refresh">↻ 刷新</button>
              <button class="button">自动刷新：开</button>
              <button class="button">数据说明</button>
            </div>
          </header>
          <p class="scenario-caption">当前原型场景：${selected.label} · 场景切换仅用于交互评审，不进入正式业务页面。</p>

          ${banner()}
          ${runtimePanel()}
          ${businessPanel()}
          ${chartPanels()}
          ${propagationPanel()}
        `;

        document.querySelectorAll("[data-scenario]").forEach((button) => {
          button.addEventListener("click", () => {
            currentScenario = button.dataset.scenario;
            render();
          });
        });

        document.querySelectorAll("[data-action]").forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.action;
            if (action === "retry-all" || action === "retry-module") {
              showToast("正在重新加载，已保留当前范围和时间窗口");
              window.setTimeout(() => {
                currentScenario = "normal";
                render();
                showToast("加载成功，数据已更新");
              }, 700);
              return;
            }
            if (action === "adjust-filter") {
              showToast("请调整数据范围或时间窗口后重新查询");
              return;
            }
            if (action === "refresh") {
              showToast(
                currentScenario === "empty"
                  ? "刷新完成，当前范围仍无数据"
                  : "刷新完成",
              );
              return;
            }
            showToast("展示数据来源、统计窗口和状态定义");
          });
        });
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
      }

      render();
    </script>
  </body>
</html>
