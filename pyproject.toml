[project]
name = "knowledge-base"
version = "0.1.0"
description = "FastAPI and LangChain based enterprise knowledge base backend scaffold."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "gunicorn>=23,<24",
    "python-multipart>=0.0.20,<1.0",
    "pydantic>=2.10,<3.0",
    "PyYAML>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "databases[postgresql]>=0.9,<1.0",
    "asyncpg>=0.30,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-community>=0.4,<1.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "tiktoken>=0.9,<1.0",
    "pypdf>=5.0,<7.0",
    "docx2txt>=0.8,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<7.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "arq>=0.26,<1.0",
    "redis>=5.0,<7.0",
    "aiosqlite>=0.22.1",
    "loguru>=0.7.3",
    "immutables>=0.21",
    "pymysql>=1.2.0",
    "minio>=7.2,<8.0",
    "python-dotenv>=1.2,<2.0",
    "deepagents>=0.6,<0.7",
    "apscheduler>=3.10,<4.0",
    "langgraph>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.12,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
